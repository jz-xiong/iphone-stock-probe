<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1d1f">
<title>iPhone 18 Pro Max 库存监控 · 北京</title>
<style>
  :root{
    --bg:#f5f5f7; --fg:#1d1d1f; --muted:#86868b; --card:#fff;
    --line:#e8e8ed; --ok:#34c759; --bad:#ff3b30; --warn:#ff9500; --grey:#8e8e93;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#000; --fg:#f5f5f7; --muted:#98989d; --card:#1c1c1e; --line:#38383a; }
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--fg);padding:16px 16px 40px;
    max-width:560px;margin:0 auto;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .top{text-align:center;padding:12px 0 18px}
  .top h1{font-size:21px;font-weight:700;letter-spacing:-.4px}
  .top .sub{font-size:13px;color:var(--muted);margin-top:5px}

  .hero{
    background:linear-gradient(135deg,#1d1d1f,#3a3a3c);
    color:#fff;border-radius:18px;padding:22px 18px;text-align:center;
    margin-bottom:14px;
  }
  @media (prefers-color-scheme:dark){
    .hero{background:linear-gradient(135deg,#2c2c2e,#1c1c1e)}
  }
  .hero .pname{font-size:14px;opacity:.75;margin-bottom:10px;line-height:1.4}
  .hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
  .hero .big.ok{color:#34c759}
  .hero .big.bad{color:#ff6b60}
  .hero .big.grey{color:#aeaeb2}
  .hero .meta{font-size:12px;opacity:.6;margin-top:10px;line-height:1.6}

  .notice{
    background:rgba(255,149,0,.12);border:1px solid rgba(255,149,0,.35);
    color:#c86a00;border-radius:12px;padding:11px 14px;font-size:13px;
    line-height:1.55;margin-bottom:14px;
  }
  @media (prefers-color-scheme:dark){ .notice{color:#ffb340} }

  .sec{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 9px;padding-left:2px}

  .store{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin-bottom:9px;
  }
  .store.on{border:2px solid var(--ok);background:rgba(52,199,89,.07)}
  .store .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .store .nm{font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .store .st{font-size:13px;font-weight:600;white-space:nowrap}
  .store .st.ok{color:var(--ok)} .store .st.bad{color:var(--bad)}
  .store .st.grey{color:var(--grey)} .store .st.unk{color:var(--warn)}
  .store .ad{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.55}
  .tag{
    font-size:11px;font-weight:600;color:#fff;background:var(--ok);
    padding:2px 7px;border-radius:9px;
  }
  .tag.out{background:var(--warn)}

  .cta{
    display:block;text-align:center;background:#0071e3;color:#fff;
    text-decoration:none;font-size:15px;font-weight:600;
    border-radius:13px;padding:14px;margin-top:16px;
  }
  .cta:active{opacity:.85}

  .feed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
  .feed .it{font-size:13px;line-height:1.6;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
  .feed .it:last-child{border-bottom:none}
  .feed .tm{color:var(--muted);font-size:12px;white-space:nowrap;min-width:88px}
  .feed .empty{font-size:13px;color:var(--muted);text-align:center;padding:8px 0}

  .foot{text-align:center;font-size:11px;color:var(--muted);line-height:1.8;margin-top:20px}
  .foot a{color:#0071e3;text-decoration:none}
  .fresh{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px}
  .spin{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div class="top">
  <h1>📱 iPhone 库存监控</h1>
  <div class="sub">北京 6 家 Apple Store · 到店取货</div>
</div>

<div id="app">
  <div class="loading"><span class="spin">◌</span> 正在读取库存数据…</div>
</div>

<div class="foot">
  <div id="footinfo"></div>
  <div style="margin-top:8px">数据来源：Apple 零售店取货接口 · 每 10 分钟自动更新</div>
</div>

<script>
var LABEL = {
  available:   {t:'可门店取货', c:'ok'},
  unavailable: {t:'目前无货',   c:'bad'},
  ineligible:  {t:'暂未开放取货', c:'grey'},
  unknown:     {t:'状态未知',   c:'unk'}
};

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function agoText(iso){
  if(!iso) return '未知';
  var t = Date.parse(iso);
  if(isNaN(t)) return '未知';
  var d = Math.floor((Date.now()-t)/1000);
  if(d < 0) d = 0;
  if(d < 60) return d + ' 秒前';
  if(d < 3600) return Math.floor(d/60) + ' 分钟前';
  if(d < 86400) return Math.floor(d/3600) + ' 小时前';
  return Math.floor(d/86400) + ' 天前';
}

function fmtTime(iso){
  if(!iso) return '';
  var t = Date.parse(iso);
  if(isNaN(t)) return '';
  var dt = new Date(t + 8*3600*1000); // 显示北京时间
  function p(n){ return n<10 ? '0'+n : ''+n; }
  return dt.getUTCFullYear()+'-'+p(dt.getUTCMonth()+1)+'-'+p(dt.getUTCDate())
       + ' ' + p(dt.getUTCHours())+':'+p(dt.getUTCMinutes());
}

var lastLoad = 0;

function render(d){
  var s = d.summary || {};
  var lvl = s.level || 'none';
  var cls = lvl==='none' ? (s.unknown?'grey':'bad') : 'ok';

  var hero =
    '<div class="hero">'
    + '<div class="pname">'+esc((d.product||{}).name||'—')+'</div>'
    + '<div class="big '+cls+'">'+esc(s.headline||'—')+'</div>'
    + '<div class="meta">最后检查 '+esc(agoText(d.updated_at))+''
    + (d.product&&d.product.price ? ' · '+esc(d.product.price) : '')
    + '</div></div>';

  var notice = '';
  if(d.last_error){
    notice = '<div class="notice">⚠️ 最近一次查询失败：'+esc(d.last_error)
           + '<br>页面显示的是上一次成功获取的数据。</div>';
  }

  var html = hero + notice + '<div class="sec">北京门店状态</div>';

  (d.stores||[]).forEach(function(st){
    var L = LABEL[st.status] || LABEL.unknown;
    var on = st.status === 'available';
    var tag = '';
    if(st.is_new) tag = '<span class="tag">新到货</span>';
    else if(st.is_lost) tag = '<span class="tag out">已售罄</span>';
    html +=
      '<div class="store'+(on?' on':'')+'">'
      + '<div class="row"><div class="nm">'+esc(st.name)+tag+'</div>'
      + '<div class="st '+L.c+'">'+esc(L.t)+'</div></div>'
      + (st.address ? '<div class="ad">'+esc(st.address).replace(/\n/g,'<br>')+'</div>' : '')
      + '</div>';
  });

  html += '<div class="sec">最近变化</div><div class="feed">';
  var ch = (d.changes||[]).slice(0,6);
  if(ch.length){
    ch.forEach(function(c){
      var txt = c.type === 'in_stock'
        ? '🎉 到货：' + (c.stores||[]).join('、')
        : '⚠️ 售罄：' + (c.stores||[]).join('、');
      html += '<div class="it"><span class="tm">'+esc(fmtTime(c.at))+'</span><span>'+esc(txt)+'</span></div>';
    });
  } else {
    html += '<div class="empty">暂无状态变化</div>';
  }
  html += '</div>';

  if((d.summary||{}).available > 0 && d.product && d.product.buy_url){
    html += '<a class="cta" href="'+esc(d.product.buy_url)+'" target="_blank" rel="noopener">🛒 去官网下单</a>';
  }

  document.getElementById('app').innerHTML = html;
  document.getElementById('footinfo').textContent =
    '页面读取于 ' + new Date().toLocaleString('zh-CN', {hour12:false});
}

function fail(msg){
  document.getElementById('app').innerHTML =
    '<div class="notice">⚠️ 无法读取库存数据：' + esc(msg) + '</div>';
}

function load(){
  var url = './data/status.json?_=' + Date.now();
  fetch(url, {cache:'no-store'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d){ lastLoad = Date.now(); render(d); })
    .catch(function(e){ fail(e.message || String(e)); });
}

load();
setInterval(load, 60000);

// 每 30 秒刷新一次“多久前”的文字
setInterval(function(){
  var el = document.querySelector('.hero .meta');
  if(el && lastLoad){ /* 下次 load 会更新 */ }
}, 30000);
</script>
</body>
</html>
