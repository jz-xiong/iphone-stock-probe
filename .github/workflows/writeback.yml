name: test-writeback
on: workflow_dispatch
permissions:
  contents: write
jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p docs/data
          date -u +"%Y-%m-%dT%H:%M:%SZ" > docs/data/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && echo "no change" || (git commit -m "test writeback" && git push)
