name: probe-push-endpoints
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Probe push services from US runner
        run: |
          echo "=== PushPlus ==="
          curl -s -m 20 -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d '{"token":"probe","title":"t","content":"c"}' \
            -w "\nHTTP=%{http_code}\n" || echo "PushPlus FAILED"
          echo
          echo "=== WxPusher ==="
          curl -s -m 20 -X POST "https://wxpusher.zjiecode.com/api/send/message/simple-push" \
            -H "Content-Type: application/json" \
            -d '{"spt":"probe","content":"c","summary":"s","contentType":1}' \
            -w "\nHTTP=%{http_code}\n" || echo "WxPusher FAILED"
          echo
          echo "=== ServerChan ==="
          curl -s -m 20 "https://sctapi.ftqq.com/probe.send?title=t&desp=c" \
            -w "\nHTTP=%{http_code}\n" || echo "ServerChan FAILED"
