name: test push

# 手动触发：向 WxPusher 发一条测试消息，并立刻查真实投递状态
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send test push via WxPusher
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime

          spt = (os.environ.get("WXPUSHER_SPT") or "").strip()
          print("SPT 存在:", bool(spt), "| 长度:", len(spt), "| 前缀:", spt[:4])

          if not spt:
              print("SPT 为空 —— 仓库未配置 WXPUSHER_SPT secret")
              raise SystemExit(1)

          now = datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")

          body = "\n".join([
              "**推送测试（第二次）**",
              "",
              "收到这条消息说明链路已经打通。",
              "",
              "以后 iPhone 18 Pro Max 512GB 冰川蓝色",
              "在北京门店有货时，会推送到这里。",
              "",
              "---",
              "发送时间：" + now,
              "📊 面板：https://jz-xiong.github.io/iphone-stock-probe/",
          ])

          payload = {
              "spt": spt,
              "content": body,
              "summary": "库存监控 · 第二次推送测试",
              "contentType": 3,   # 3 = Markdown
              "url": "https://jz-xiong.github.io/iphone-stock-probe/",
          }

          req = urllib.request.Request(
              "https://wxpusher.zjiecode.com/api/send/message/simple-push",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  raw = r.read().decode("utf-8", "replace")
              print("HTTP:", r.status)
              print("响应:", raw[:700])

              # 解析 sendRecordId，立刻查真实投递状态
              try:
                  data = json.loads(raw)
                  for rec in (data.get("data") or []):
                      rid = rec.get("sendRecordId")
                      if rid:
                          q = urllib.request.Request(
                              "https://wxpusher.zjiecode.com/api/send/query/status"
                              "?sendRecordId={}".format(rid))
                          with urllib.request.urlopen(q, timeout=20) as qr:
                              print("状态查询 (sendRecordId={}): {}".format(
                                  rid, qr.read().decode("utf-8", "replace")[:300]))
              except Exception as e2:
                  print("状态查询失败:", type(e2).__name__, e2)

          except Exception as e:
              print("发送失败:", type(e).__name__, e)
              raise SystemExit(1)
          PY
